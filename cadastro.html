<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Jogos - PayldrGames</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #171224 0%, #0a0810 100%);
            color: #f3f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            filter: blur(180px);
            opacity: 0.12;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; background: #3b82f6; }
        .blob-2 { bottom: -10%; right: -10%; }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #c084fc 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Form styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #a78bfa;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
            background: rgba(0, 0, 0, 0.35);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
            filter: brightness(1.1);
        }

        button.cancel-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            box-shadow: none;
        }

        button.cancel-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        /* Games List styling */
        .list-section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f3f0ff;
            border-left: 4px solid #8b5cf6;
            padding-left: 12px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .game-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: linear-gradient(135deg, #2e1065 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 2rem;
            font-weight: 700;
        }

        .game-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .game-url {
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: none;
            word-break: break-all;
            display: inline-block;
            transition: color 0.2s;
        }

        .game-url:hover {
            color: #a78bfa;
        }

        .game-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn {
            background: rgba(167, 139, 250, 0.1);
            color: #c084fc;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .edit-btn:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-style: italic;
        }

        /* Toast container */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            bottom: 30px;
        }

        .toast-success { background: #10b981; color: #fff; }
        .toast-error { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="header-section">
            <h1>PayldrGames</h1>
            <p class="subtitle">Gerencie os pacotes de jogos disponíveis no servidor</p>
        </div>

        <!-- Formulário de Cadastro / Edição -->
        <div class="card">
            <h2 id="formTitle" style="font-size: 1.3rem; margin-bottom: 20px; color: #c084fc;">Adicionar Novo Jogo</h2>
            <form id="gameForm">
                <input type="hidden" id="gameId" name="id">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome do Jogo</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Ikemen GO" required>
                    </div>

                    <div class="form-group">
                        <label for="url">URL do Jogo</label>
                        <input type="url" id="url" name="url" placeholder="Ex: https://..." required>
                    </div>

                    <div class="form-group full-width">
                        <label for="imagem">URL da Imagem (Opcional)</label>
                        <input type="url" id="imagem" name="imagem" placeholder="Ex: https://.../capa.jpg">
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" id="submitBtn">Cadastrar Jogo</button>
                    <button type="button" id="cancelBtn" class="cancel-btn" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista de Jogos -->
        <div>
            <h2 class="list-section-title">Jogos Disponíveis</h2>
            <div class="games-grid" id="gamesGrid">
                <!-- Populado via Javascript -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const form = document.getElementById('gameForm');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const gameIdInput = document.getElementById('gameId');
        const gamesGrid = document.getElementById('gamesGrid');
        const toast = document.getElementById('toast');

        let isEditing = false;

        function showToast(message, type = 'success') {
            toast.innerText = message;
            toast.className = 'toast show ' + (type === 'success' ? 'toast-success' : 'toast-error');
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        async function loadGames() {
            try {
                const res = await fetch('/payldr/api/games');
                const games = await res.json();
                
                gamesGrid.innerHTML = '';
                if (games.length === 0) {
                    gamesGrid.innerHTML = '<div class="empty-state">Nenhum jogo cadastrado até o momento.</div>';
                    return;
                }

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    
                    let imageEl = '';
                    if (game.imagem && game.imagem.trim() !== '') {
                        imageEl = `<img class="game-img" src="${game.imagem}" alt="${game.nome}" onerror="this.onerror=null; this.outerHTML='<div class=game-img>🎮</div>';">`;
                    } else {
                        imageEl = '<div class="game-img">🎮</div>';
                    }

                    card.innerHTML = `
                        ${imageEl}
                        <div class="game-info">
                            <div class="game-name">${game.nome}</div>
                            <a class="game-url" href="${game.url}" target="_blank">${game.url}</a>
                            <div class="game-actions">
                                <div class="action-btn edit-btn" onclick="startEdit(${game.id}, '${encodeURIComponent(game.nome)}', '${encodeURIComponent(game.url)}', '${encodeURIComponent(game.imagem || '')}')">Editar</div>
                                <div class="action-btn delete-btn" onclick="deleteGame(${game.id})">Deletar</div>
                            </div>
                        </div>
                    `;
                    gamesGrid.appendChild(card);
                });
            } catch (err) {
                showToast('Erro ao carregar lista de jogos', 'error');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando...';

            const payload = {
                nome: document.getElementById('nome').value,
                url: document.getElementById('url').value,
                imagem: document.getElementById('imagem').value
            };

            const id = gameIdInput.value;
            const url = isEditing ? `/payldr/api/games/${id}` : '/payldr/api/games';
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok && result.sucesso) {
                    showToast(isEditing ? 'Jogo atualizado com sucesso!' : 'Jogo cadastrado com sucesso!', 'success');
                    resetForm();
                    loadGames();
                } else {
                    showToast(result.mensagem || 'Erro ao salvar jogo', 'error');
                }
            } catch (err) {
                showToast('Erro de rede ao conectar ao servidor', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isEditing ? 'Salvar Alterações' : 'Cadastrar Jogo';
            }
        });

        function startEdit(id, nome, url, imagem) {
            isEditing = true;
            gameIdInput.value = id;
            document.getElementById('nome').value = decodeURIComponent(nome);
            document.getElementById('url').value = decodeURIComponent(url);
            document.getElementById('imagem').value = decodeURIComponent(imagem);
            
            formTitle.innerText = 'Editar Jogo';
            submitBtn.innerText = 'Salvar Alterações';
            cancelBtn.style.display = 'block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            isEditing = false;
            form.reset();
            gameIdInput.value = '';
            formTitle.innerText = 'Adicionar Novo Jogo';
            submitBtn.innerText = 'Cadastrar Jogo';
            cancelBtn.style.display = 'none';
        }

        cancelBtn.addEventListener('click', resetForm);

        async function deleteGame(id) {
            if (!confirm('Deseja realmente deletar este jogo?')) return;
            try {
                const res = await fetch(`/payldr/api/games/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (res.ok && result.sucesso) {
                    showToast('Jogo deletado com sucesso!', 'success');
                    loadGames();
                    if (isEditing && gameIdInput.value == id) {
                        resetForm();
                    }
                } else {
                    showToast(result.mensagem || 'Erro ao deletar jogo', 'error');
                }
            } catch (err) {
                showToast('Erro de rede ao conectar ao servidor', 'error');
            }
        }

        // Carga inicial
        loadGames();
    </script>
</body>
</html>
