# 1. Redirecionar HTTP (Porta 80) para HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name devserver.marketpix.com.br dashboard.marketpix.com.br;
    return 301 https://$host$request_uri;
}

# 2. Servidor HTTPS (Proxy Reverso para VeiLoc e Payldr)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devserver.marketpix.com.br;
    ssl_certificate /etc/letsencrypt/live/devserver.marketpix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devserver.marketpix.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /payldr {
        proxy_pass https://127.0.0.1:9710;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9715;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Servidor HTTPS para o Dashboard (PulseGuard)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.marketpix.com.br;
    ssl_certificate /etc/letsencrypt/live/dashboard.marketpix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.marketpix.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:7756;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
